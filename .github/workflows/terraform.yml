name: Terraform Azure Infrastructure

on:
  push:
    branches:
      - master
    paths:
      - "Azure/terraform/**"
      - ".github/workflows/terraform.yml"

  pull_request:
    branches:
      - master
    paths:
      - "Azure/terraform/**"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TF_WORKING_DIR: Azure/terraform

  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.TF_WORKING_DIR }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=threetierdemo" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=robotshop-dev.tfstate" \
            -backend-config="use_oidc=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_monitoring_email: ${{ secrets.MONITORING_EMAIL }}
        run: |
          if [ -z "$TF_VAR_subscription_id" ]; then
            echo "AZURE_SUBSCRIPTION_ID secret is missing"
            exit 1
          fi

          if [ -z "$TF_VAR_monitoring_email" ]; then
            echo "MONITORING_EMAIL secret is missing"
            exit 1
          fi

          terraform plan -input=false
